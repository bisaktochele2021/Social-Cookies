plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.legacy.kapt)
    alias(libs.plugins.google.services)
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { instr ->
        localProperties.load(instr)
    }
}

android {
    namespace 'dev.daymond.socialcookies'
    compileSdk 35

    defaultConfig {
        applicationId "dev.daymond.socialcookies"
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName "1.1"

        buildConfigField("String", "BACKEND_API_KEY", "\"${localProperties.getProperty('BACKEND_API_KEY', '89f3a479bc0241b18d2d6ee94e9f5e')}\"")

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.webkit
    
    // Room
    implementation libs.room.runtime
    implementation libs.room.ktx
    kapt libs.room.compiler
    
    // Coroutines & Lifecycle
    implementation libs.kotlinx.coroutines.android
    implementation libs.lifecycle.runtime.ktx

    // Firebase & Authentication
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.database
    implementation libs.play.services.auth

    // Excel Export
    implementation libs.poi
    implementation libs.poi.ooxml

    // Networking
    implementation libs.retrofit
    implementation libs.converter.gson
    implementation libs.gson

    // Chart
    implementation libs.mpandroidchart

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}
